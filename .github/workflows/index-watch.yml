# NIK-564, 9 Nov 2026: report the crawler result, never inferred indexing or fixed success text.
# Actions billing can prevent a job from starting. No report then means unknown, not healthy.
name: Site Health Watch

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # check_site.py gate 9 needs the private app sources at the claim evidence commit.
      - name: Read claim evidence revision
        id: claims
        run: |
          python3 -c 'import json; print("revision=" + json.load(open("data/claims.json"))["app_repo_commit"])' >> "$GITHUB_OUTPUT"
      - name: Check out claim evidence
        uses: actions/checkout@v4
        with:
          repository: Nikita-Guzenko/invoicesnap-expo
          ref: ${{ steps.claims.outputs.revision }}
          token: ${{ secrets.SITE_WATCH_APP_TOKEN }}
          path: app-evidence
          persist-credentials: false
      - name: Prepare crawler dependencies
        run: |
          mkdir -p "$HOME/.cache" "$HOME/firstmate-invoicesnap/projects"
          ln -s "$GITHUB_WORKSPACE/app-evidence" "$HOME/firstmate-invoicesnap/projects/invoicesnap-expo"
          python3 -m pip install playwright==1.60.0 openpyxl==3.1.5
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m playwright install --with-deps chrome
      - name: Crawl production
        id: crawl
        shell: bash
        run: |
          set -o pipefail
          python3 check_site.py --base https://invoicesnap.work 2>&1 | tee site-watch.log
      - name: Publish measured result
        if: always()
        env:
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        shell: bash
        run: |
          {
            echo '## InvoiceSnap site health'
            echo
            echo "Crawler outcome: ${CRAWL_OUTCOME:-unknown}"
            echo 'Indexing: unknown. Use Search Console URL inspection for indexing evidence.'
            echo
            if [ -f site-watch.log ]; then
              echo 'Crawler output (last 100 lines):'
              echo '```text'
              tail -n 100 site-watch.log
              echo '```'
            else
              echo 'No crawler result. Setup failed or the crawl did not run; site health is unknown.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
